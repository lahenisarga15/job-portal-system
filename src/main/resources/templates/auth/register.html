<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | CareerSpring</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="form-card"><div class="eyebrow" style="color:#6c4cff">Get started for free</div><h1>Create your account</h1><p class="muted">Join as an applicant looking for work or an employer hiring talent.</p><form th:action="@{/register}" th:object="${user}" method="post"><div class="field"><label for="fullName">Full name</label><input id="fullName" th:field="*{fullName}" placeholder="Your full name" required><div class="error" th:errors="*{fullName}"></div></div><div class="field"><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" placeholder="you@example.com" required><div class="error" th:errors="*{email}"></div></div><div class="field"><label for="password">Password (minimum 6 characters)</label><input id="password" type="password" th:field="*{password}" minlength="6" required><div class="error" th:errors="*{password}"></div></div><div class="field"><label for="accountRole">I want to</label><select id="accountRole" name="accountRole"><option value="APPLICANT">Find a job (Applicant)</option><option value="EMPLOYER">Hire talent (Employer)</option></select></div><div class="field"><label for="companyName">Company name (optional for employers)</label><input id="companyName" th:field="*{companyName}" placeholder="Your company"></div><button class="btn" type="submit" style="width:100%">Create account →</button></form><p class="muted">Already registered? <a href="/login">Log in</a></p></div></main><footer class="footer">CareerSpring · Find your fit. Build your future.</footer></body></html>
