<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a job | CareerSpring</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="form-card"><div class="eyebrow" style="color:#6c4cff">Find your next teammate</div><h1>Post a new opportunity</h1><p class="muted">Give applicants the details they need to see if this role is right for them.</p><form th:action="@{/employer/jobs}" th:object="${job}" method="post"><div class="field"><label for="title">Job title</label><input id="title" th:field="*{title}" placeholder="e.g. Java Developer" required><div class="error" th:errors="*{title}"></div></div><div class="two-col"><div class="field"><label for="company">Company</label><input id="company" th:field="*{company}" placeholder="Company name" required><div class="error" th:errors="*{company}"></div></div><div class="field"><label for="location">Location</label><input id="location" th:field="*{location}" placeholder="Pune / Remote" required><div class="error" th:errors="*{location}"></div></div></div><div class="two-col"><div class="field"><label for="jobType">Job type</label><select id="jobType" th:field="*{jobType}" required><option value="Full-time">Full-time</option><option value="Part-time">Part-time</option><option value="Internship">Internship</option><option value="Contract">Contract</option></select></div><div class="field"><label for="salary">Annual salary (₹)</label><input id="salary" type="number" min="0" step="1000" th:field="*{salary}" placeholder="450000"><div class="error" th:errors="*{salary}"></div></div></div><div class="field"><label for="skills">Skills (comma separated)</label><input id="skills" th:field="*{skills}" placeholder="Java, Spring Boot, SQL"></div><div class="field"><label for="description">Job description</label><textarea id="description" th:field="*{description}" placeholder="Responsibilities, qualifications, and what makes this role exciting..." required></textarea><div class="error" th:errors="*{description}"></div></div><button class="btn" type="submit">Publish job →</button> <a href="/employer/dashboard" class="btn btn-outline">Cancel</a></form></div></main><footer class="footer">CareerSpring · Helping great teams meet great people.</footer></body></html>
